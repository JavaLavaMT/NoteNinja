name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PortAudio
        run: sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic openai sounddevice soundfile numpy python-dotenv psutil pillow pytest

      - name: Run tests
        run: pytest tests/ -v
